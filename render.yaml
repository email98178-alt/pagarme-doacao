services:
  - type: web
    name: doacao-ezequiel-pagarme
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: PAGARME_SECRET_KEY
        sync: false
      - key: PAGARME_CUSTOMER_NAME
        sync: false
      - key: PAGARME_CUSTOMER_EMAIL
        sync: false
      - key: PAGARME_CUSTOMER_DOCUMENT
        sync: false
      - key: PAGARME_CUSTOMER_PHONE
        sync: false
